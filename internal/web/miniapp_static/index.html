<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="qrcode.min.js"></script>
<style>
:root{
  /* premium dark palette — independent of TG theme, but accent picks up tg.button_color */
  --bg:#0b0f17;
  --bg-2:#0e1320;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.10);
  --stroke-strong:rgba(255,255,255,.18);
  --text:#eef2f8;
  --muted:#8b94a7;
  --muted-2:#5f6877;
  --accent:var(--tg-theme-button-color,#5b8cff);
  --accent-2:#9d7bff;
  --accent-text:#fff;
  --good:#34d399;
  --good-glow:rgba(52,211,153,.35);
  --bad:#f87171;
  --warn:#e0a200;
  --radius:20px;
  --radius-sm:14px;
  --space:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overflow-wrap:break-word;
}
/* global icon sizing — inline SVGs have no intrinsic size, must be capped */
svg{width:18px;height:18px;flex:none;vertical-align:middle}
.hero .top svg{width:24px;height:24px;color:var(--accent);opacity:.85}
.status svg{width:15px;height:15px}
.until svg{width:15px;height:15px}
.sec-title svg{width:15px;height:15px}
/* animated ambient background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -10%,rgba(91,140,255,.16),transparent 60%),
  linear-gradient(180deg,var(--bg-2),var(--bg) 40%)}
.bg::before,.bg::after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.45}
.bg::before{background:radial-gradient(circle,var(--accent),transparent 60%);top:-25vmax;left:-15vmax;animation:drift1 18s ease-in-out infinite alternate}
.bg::after{background:radial-gradient(circle,var(--accent-2),transparent 60%);bottom:-25vmax;right:-15vmax;animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,-6vmax) scale(1.1)}}

.wrap{max-width:520px;margin:0 auto;padding:calc(var(--safe-top) + 12px) var(--space) calc(var(--safe-bot) + 24px)}

/* view transition */
#app{animation:viewIn .42s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0;animation:rise .5s cubic-bezier(.22,1,.36,1) forwards}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}
.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}
.stagger>*:nth-child(8){animation-delay:.37s}
@keyframes rise{to{opacity:1;transform:none}}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}
.head h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--stroke);backdrop-filter:blur(12px)}
.chip svg{width:15px;height:15px;opacity:.9}

/* glass card */
.card{position:relative;background:var(--surface);border:1px solid var(--stroke);
  border-radius:var(--radius);padding:18px;margin-bottom:14px;backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.card.glow{border-color:var(--stroke-strong);box-shadow:0 10px 40px rgba(91,140,255,.20),inset 0 1px 0 rgba(255,255,255,.08)}

/* hero subscription */
.hero{overflow:hidden}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good-glow);animation:pulse 2.2s infinite}
.dot.off{background:var(--muted-2);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--good-glow)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero .title{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:10px 0 2px;
  background:linear-gradient(120deg,#fff,#cdd6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.until{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 16%,transparent);padding:7px 12px;border-radius:12px;margin-top:8px;max-width:100%}
.metric{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--stroke)}
.metric .l{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
.metric .l svg{width:18px;height:18px;opacity:.8}
.metric b{font-size:15px;font-variant-numeric:tabular-nums}

.linkbox{margin-top:14px}
.linkbox .lab{font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  word-break:break-all;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--stroke);
  border-radius:12px;padding:11px 12px;line-height:1.5}

/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:0;border-radius:14px;font-weight:650;font-size:15.5px;padding:15px;margin-top:10px;cursor:pointer;text-align:center;overflow-wrap:anywhere;
  color:var(--accent-text);overflow:hidden;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform .12s ease,box-shadow .12s ease}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.975)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-130%);transition:transform .6s}
.btn:active::after{transform:translateX(130%)}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--stroke);box-shadow:none;backdrop-filter:blur(12px);font-weight:600}
.btn.sec:active{background:var(--surface-2)}
.btn.ghost{background:transparent;border:1px solid var(--stroke);box-shadow:none;color:var(--muted);font-weight:600}

/* plan cards */
.sec-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:20px 4px 12px;display:flex;align-items:center;gap:8px}
.plan{position:relative;display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:16px 18px;margin-bottom:10px;
  cursor:pointer;backdrop-filter:blur(12px);transition:transform .12s ease,border-color .2s ease,background .2s ease}
.plan:active{transform:scale(.98)}
.plan .pl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.plan .pm{font-size:16px;font-weight:700}
.plan .ps{font-size:12px;color:var(--muted)}
.plan .price{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;flex:none;white-space:nowrap;margin-left:12px;text-align:right}
.plan .price .disc{display:block;font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--good);text-align:right;margin-top:1px;margin-left:auto;white-space:normal;max-width:11em}
.plan.best{border-color:transparent;background:
  linear-gradient(var(--bg-2),var(--bg-2)) padding-box,
  linear-gradient(120deg,var(--accent),var(--accent-2)) border-box;
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 22%,transparent)}
.plan.best::before{content:"ВЫГОДНО";position:absolute;top:-8px;right:14px;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  padding:3px 8px;border-radius:999px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 45%,transparent)}

/* input */
.field{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:12px;
  color:var(--text);padding:14px;font-size:15px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--accent)}
input[type=file].field{padding:10px 12px;color:var(--muted);cursor:pointer;line-height:1.2}
input[type=file].field::file-selector-button{font:inherit;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--stroke);border-radius:10px;padding:9px 14px;margin-right:12px;cursor:pointer;transition:background .15s}
input[type=file].field::file-selector-button:hover{background:var(--surface)}
.field::placeholder{color:var(--muted-2)}

.hint{color:var(--muted);font-size:13.5px}
.toplink{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0 12px;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.toplink:hover{color:var(--text)}
.legal{font-size:14px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere}
.legal a{color:var(--acc)}
.legal pre{white-space:pre-wrap}
.legal img{max-width:100%;height:auto}
.legal table{display:block;max-width:100%;overflow-x:auto}
.hint.center{text-align:center;margin-top:10px}
.err{color:var(--bad);font-size:14.5px;font-weight:500}
/* plan feature list */
.feat{margin-bottom:14px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;background:var(--surface);border:1px solid var(--stroke);border-bottom:0;backdrop-filter:blur(12px)}
.frow:first-child{border-radius:14px 14px 0 0}
.frow:last-child{border-bottom:1px solid var(--stroke);border-radius:0 0 14px 14px}
.frow:only-child{border-radius:14px}
.frow .l{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.frow b{font-size:14.5px;font-variant-numeric:tabular-nums;text-align:right}
.frow.dev{display:block}
.frow.dev .dn{font-size:14px;font-weight:600;line-height:1.35}
.frow.dev .dm{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip2{max-width:100%;overflow-wrap:anywhere;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--stroke);backdrop-filter:blur(10px)}
.flag{width:21px;height:15px;border-radius:3px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.14)}

/* skeletons */
.sk{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-line{height:13px;border-radius:7px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.sk-line::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:shimmer 1.5s infinite}
.sk-hero{height:188px;border-radius:var(--radius);margin-bottom:14px}
.sk-row{height:64px;border-radius:16px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 22px);transform:translateX(-50%) translateY(20px);
  background:rgba(20,26,38,.92);border:1px solid var(--stroke-strong);color:var(--text);font-size:14px;font-weight:600;
  padding:12px 18px;border-radius:14px;backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;display:flex;align-items:center;gap:9px;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px;flex:0 0 auto}
.cmodal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(4,7,12,.62);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.cmodal.show{display:flex;opacity:1}
.cmodal-card{width:100%;max-width:360px;background:var(--surface-2);border:1px solid var(--stroke-strong);
  border-radius:var(--radius);padding:20px;backdrop-filter:blur(24px) saturate(140%);
  box-shadow:0 24px 70px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);transition:transform .2s}
.cmodal.show .cmodal-card{transform:none}
.cmodal-msg{font-size:14.5px;line-height:1.5;color:var(--text);white-space:pre-line;margin-bottom:18px}
.cmodal-btns{display:flex;gap:10px}
.cmodal-btns .btn{margin-top:0}
.qrbox{background:#fff;padding:10px;border-radius:14px;line-height:0;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:4px;margin:16px 0 10px}
.segbtn{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:10px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s;font-family:inherit}
.segbtn.on{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
.appc{background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(12px)}
.appc.feat{border-color:transparent;background:linear-gradient(var(--bg-2),var(--bg-2)) padding-box,linear-gradient(120deg,var(--accent),var(--accent-2)) border-box}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.appname{overflow-wrap:anywhere;font-size:16px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0}
.appdesc{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.fbadge{white-space:nowrap;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:999px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2))}
.pass{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#26305a,#3c2668 48%,#143a52);box-shadow:0 12px 30px rgba(91,140,255,.22);margin-bottom:14px}
.pass .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 33%,rgba(255,255,255,.12) 49%,transparent 64%);pointer-events:none}
.pass .ph{position:relative;padding:15px 16px 13px}
.pass .pl{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pass .brand{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#cdd6ff}
.pass .pstat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#bdf3da}
.pass .route{display:flex;align-items:center;justify-content:space-between;color:#fff}
.pass .route .pt{font-size:17px;font-weight:800}
.pass .route .pic svg{color:#9fb4e8}
.pass .route .ln{flex:1;height:2px;margin:0 10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 5px,transparent 5px 10px)}
.pass .perf{position:relative;border-top:1.5px dashed rgba(255,255,255,.28);margin:0 16px}
.pass .stub{display:flex;justify-content:space-between;gap:10px 14px;padding:13px 18px 15px}
.pass .stub .c{min-width:0}
@media(max-width:439px){.pass .stub.n4{display:grid;grid-template-columns:1fr 1fr}.pass .stub.n4 .c{text-align:left}.pass .stub.n4 .c:nth-child(even){text-align:right}}
.pass .stub .c .k{font-size:9px;letter-spacing:1px;color:#9aa3ba;margin-bottom:3px}
.pass .stub .c .v{font-size:14px;font-weight:800;color:#fff;white-space:nowrap}
.pass .stub .c:nth-child(2){text-align:center}
.pass .stub .c:last-child{text-align:right}
body.web .wrap{max-width:960px}
.ublock{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:11px 13px;margin-bottom:14px;backdrop-filter:blur(12px)}
.uava{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2))}
.uava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.uinfo{flex:1;min-width:0}
.uname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usub{font-size:12px;color:var(--muted)}
.ulogout{width:auto;margin:0;padding:9px 13px;font-size:13px;flex:none}
.cols{display:flex;flex-direction:column;gap:10px}
@media(min-width:700px){
  body.web .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
  body.web .cols>.plan,body.web .cols>.appc{margin-bottom:0}
}
.coins{display:flex;justify-content:center;margin-top:14px}
.coins svg{width:128px;height:48px}
.payhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:0 12px}
.payhead .title{min-width:0}
.payhead .title{margin:6px 0 0}
.bigprice{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;background:linear-gradient(120deg,#fff,#cdd6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* ---- web cabinet desktop layout: independent design, grouped, never stretched ---- */
.seg{flex-wrap:wrap}
.segbtn{flex:1 1 auto;min-width:96px}
.btnrow .btn{margin-top:10px}
body.web .authwrap{max-width:480px;margin:0 auto}
.tgwrap{display:flex;justify-content:center;margin:2px 0 8px;min-height:50px}
#tglogin{width:100%;display:flex;justify-content:center}
#tglogin iframe{background:transparent !important;border-radius:12px !important;color-scheme:normal}
.authcard{padding:22px 20px 20px}
.authwrap .card{padding:20px}
.authwrap .field{padding:14px 15px;font-size:15px}
.authwrap .btn{height:50px}
@media(min-width:700px){
  body.web .acctgrp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:stretch;margin-bottom:16px}
  body.web .acctgrp>.ublock,body.web .acctgrp>.pass{margin-bottom:0}
  body.web .acctgrp>.ublock{align-self:start}
  body.web .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  body.web .btnrow>.btn{margin-top:0}
  body.web .sec-title{margin-top:26px}
}
/* ---- кабинет на широком экране: меню слева, панель из карточек ---- */
.side{display:none}
.mainc{min-width:0}
@media(min-width:960px){
  body.desk .wrap{max-width:1240px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px;align-items:start;padding:28px 32px 48px}
  body.desk.noside .wrap{display:block;max-width:960px}
  body.desk.noside .side{display:none}
  body.desk .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:28px;min-height:calc(100vh - 76px);
    background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius);padding:18px 12px 14px;
    backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.28)}
  body.desk .head{margin:6px 2px 22px;min-height:36px}
  body.desk .head h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
  body.desk #balchip{display:none !important}
  body.desk:not(.noside) .btn.back,body.desk:not(.noside) .deskhide{display:none}
  body.desk .card{margin-bottom:16px}
  body.desk .sec-title{margin:10px 4px 12px}
  body.desk .split .cols{grid-template-columns:minmax(0,1fr)}
  .sbrand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:-.2px;padding:2px 10px 18px}
  .sbrand .lg{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
  .sbrand .lg svg{width:17px;height:17px}

<script>

  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',

const app=document.getElementById('app');
const balchip=document.getElementById('balchip');
let TOKEN=null;
const WEB=!(tg&&tg.initData); // browser cabinet vs Telegram mini-app
try{if(WEB)document.body.classList.add('web');}catch(e){}
function getStoredToken(){try{return WEB?localStorage.getItem('cab_tok'):null;}catch(e){return null;}}
function setStoredToken(t){try{if(WEB)localStorage.setItem('cab_tok',t||'');}catch(e){}}
function clearToken(){try{if(WEB)localStorage.removeItem('cab_tok');}catch(e){}TOKEN=null;}
function lsGet(k){try{return WEB?localStorage.getItem(k):null;}catch(e){return null;}}
function lsSet(k,v){try{if(!WEB)return;if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
// Параметры ссылки, по которой открыли кабинет: ?promo=, ?plan=, ?ref=, ?inv=
// или ?start=. Работают как /start в чате, их можно сочетать. Хранятся одной
// строкой через перевод строки.
function startParams(){
  var out=[];
  try{var q=new URLSearchParams(location.search);
    ['ref','inv','promo','plan'].forEach(function(k){var v=q.get(k);if(v)out.push(k+'_'+v);});
    var s=q.get('start');if(s)out.push(s);
  }catch(e){}
  // Разделитель — перевод строки: в коде промокода бывает что угодно, кроме
  // пробельных символов.
  return out.map(function(t){return t.replace(/\s/g,'').slice(0,64);}).filter(Boolean).join('\n');
}
// На сервер при входе уходит одно: приглашение в закрытый бот или
// пригласивший друг.
function serverStart(s){
  var t=String(s||'').split('\n');
  return t.filter(function(x){return x.indexOf('inv_')===0;})[0]||t.filter(function(x){return x.indexOf('ref_')===0;})[0]||'';
}
let STATE={balanceK:0,methods:[]};
let backFn=null; // current back handler for TG BackButton
// Кабинет в браузере на широком экране: меню слева и раскладка по колонкам.
// Узкий экран и мини-апп в Telegram остаются как были.
var DESKMQ=null;try{DESKMQ=WEB&&window.matchMedia?window.matchMedia('(min-width:960px)'):null;}catch(e){}
var DESK=false;
function setDesk(){DESK=!!(DESKMQ&&DESKMQ.matches);try{document.body.classList.toggle('desk',DESK);}catch(e){}}
setDesk();
if(DESKMQ){var onDeskMQ=function(){var was=DESK;setDesk();if(was===DESK||!TOKEN||!STATE.menu)return;
  var re={plans:openPlans,wallet:openMore,connect:openConnect,account:openAccount}[PAGE];if(re)re();else boot();};
  try{if(DESKMQ.addEventListener)DESKMQ.addEventListener('change',onDeskMQ);else if(DESKMQ.addListener)DESKMQ.addListener(onDeskMQ);}catch(e){}}
// PAGE — раздел меню, к которому относится открытый экран; null — меню нет
// (вход, восстановление пароля, согласие с документами на входе).
var PAGE=null;
var PAGE_TITLES={home:'Главная',plans:'Тарифы',wallet:'Кошелёк',connect:'Подключение',account:'Аккаунт'};

/* ---- TG init + premium chrome ---- */
if(tg){
  try{tg.ready();tg.expand();}catch(e){}
  try{tg.setHeaderColor&&tg.setHeaderColor('#0b0f17');}catch(e){}
  try{tg.setBackgroundColor&&tg.setBackgroundColor('#0b0f17');}catch(e){}
  try{tg.setBottomBarColor&&tg.setBottomBarColor('#0b0f17');}catch(e){}
  try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch(e){}
  try{tg.BackButton&&tg.BackButton.onClick(function(){if(backFn)backFn();});}catch(e){}
}
function haptic(kind){try{if(tg&&tg.HapticFeedback){if(kind==='ok')tg.HapticFeedback.notificationOccurred('success');
  else if(kind==='err')tg.HapticFeedback.notificationOccurred('error');
  else tg.HapticFeedback.impactOccurred('light');}}catch(e){}}
function setBack(fn){
  backFn=fn;
  try{if(tg&&tg.BackButton){if(fn)tg.BackButton.show();else tg.BackButton.hide();}}catch(e){}
}
// NOFX — следующий экран встаёт на место скелета загрузки без анимации
// появления: иначе после скелета мелькает пустая область.
var NOFX=false;
/* swap the #app content with a fresh fade-in */
function view(html,back){
  stopWait();
  setBack(back||null);
  app.innerHTML=html;
  if(NOFX){
    NOFX=false;app.style.animation='none';
    Array.prototype.forEach.call(app.querySelectorAll('.stagger>*'),function(e){e.style.animation='none';e.style.opacity='1';});
  }else{app.style.animation='none'; void app.offsetWidth; app.style.animation='';}
  renderSide();
}
function renderSide(){
  var side=document.getElementById('side'),h1=document.querySelector('.head h1');
  if(!side)return;
  if(!DESK||!PAGE){document.body.classList.add('noside');side.innerHTML='';if(h1)h1.textContent='Личный кабинет';return;}
  document.body.classList.remove('noside');
  if(h1)h1.textContent=PAGE_TITLES[PAGE]||'Личный кабинет';
  // Данные ещё грузятся — заготовка меню, чтобы раскладка не прыгала.
  if(!STATE.menu){
    var sk='<div class="sbrand"><span class="lg">'+IC.bolt+'</span>Личный кабинет</div>';
    [76,96,108,84].forEach(function(w){sk+='<div class="snav"><span class="sk-line" style="width:18px;height:18px;border-radius:6px;flex:none"></span><span class="sk-line" style="width:'+w+'px"></span></div>';});
    side.innerHTML=sk+'<div class="sfoot"><span class="sk-line" style="width:36px;height:36px;border-radius:50%;flex:none"></span><span class="sk-line" style="width:96px"></span></div>';
    return;
  }
  var m=STATE.menu||{},sub=STATE.sub||{};
  function item(key,ic,label,fn,bdg){return '<button class="snav'+(PAGE===key?' on':'')+'" onclick="'+fn+'">'+ic+'<span>'+label+'</span>'+(bdg?'<span class="bdg">'+bdg+'</span>':'')+'</button>';}
  var h='<div class="sbrand"><span class="lg">'+IC.bolt+'</span>Личный кабинет</div>';
  h+=item('home',IC.layers,'Главная','boot()');
  if((STATE.plans&&STATE.plans.length)||STATE.plansNotice)h+=item('plans',IC.tag,'Тарифы','openPlans()');
  h+=item('wallet',IC.wallet,'Кошелёк','openMore()',esc(rub(STATE.balanceK))+' ₽');
  if(sub.sub_url)h+=item('connect',IC.download,'Подключение','openConnect()');
  h+=item('account',IC.users,'Аккаунт','openAccount()');
  if(m.support_url||m.group_url){
    h+='<div class="ssep"></div>';
    if(m.support_url)h+='<button class="snav" onclick="openSmart(\''+jsq(m.support_url)+'\')">'+IC.life+'<span>Поддержка</span></button>';
    if(m.group_url)h+='<button class="snav" onclick="openSmart(\''+jsq(m.group_url)+'\')">'+IC.users+'<span>Наша группа</span></button>';
  }
  var who=STATE.me_email||STATE.me_name||'Аккаунт';var ini=(String(who).trim().charAt(0)||'?').toUpperCase();
  h+='<div class="sfoot"><div class="uava" data-ava>'+avaHTML(ini)+'</div><div class="uinfo"><div class="uname">'+esc(who)+'</div><div class="usub">'+(STATE.me_email?'email-аккаунт':'Telegram')+'</div></div>'+
    '<button class="sout" title="Выйти" aria-label="Выйти" onclick="cabLogout()">'+IC.login+'</button></div>';
  side.innerHTML=h;
}
// deskSplit — на широком экране две колонки, на узком — подряд, как было.
// Правой колонки нет — левая не растягивается на всю ширину.
function deskSplit(left,right){
  var st='<div class="stagger">';
  if(!DESK)return left+right;
  var body=left.indexOf(st)===0?left.slice(st.length):left;
  if(!right)return st+'<div class="narrow">'+body+'</div>';
  return st+'<div class="split"><div>'+body+'</div><div>'+right+'</div></div>';
}

// Фото профиля Telegram отдаёт сам бот (/api/miniapp/avatar): браузер не ходит
// за ним к Telegram. Фото привязано к пользователю, а не к пропуску: новый
// пропуск того же человека (смена пароля, перевход мини-аппа) его не сбрасывает,
// другой аккаунт чужого фото не увидит. Аккаунт по почте без Telegram фото не
// имеет — в кружке буква.
var AVA='',AVA_ID=0;
function avaID(){return (STATE&&STATE.me_id)||0;}
function avaHTML(ini){return AVA&&AVA_ID&&AVA_ID===avaID()?'<img src="'+AVA+'" alt="">':esc(ini);}
function loadAva(){
  var id=avaID();
  if(!TOKEN||id<=0||AVA_ID===id)return;
  AVA_ID=id;if(AVA){try{URL.revokeObjectURL(AVA);}catch(e){}AVA='';}
  fetch('/api/miniapp/avatar',{headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){return r.ok?r.blob():null;}).then(function(b){
    if(!b||AVA_ID!==id||!window.URL)return;
    AVA=URL.createObjectURL(b);
    Array.prototype.forEach.call(document.querySelectorAll('[data-ava]'),function(e){e.innerHTML='<img src="'+AVA+'" alt="">';});
  }).catch(function(){});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsq(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rub(k){return (Math.round(k)/100).toLocaleString('ru-RU');}

async function authenticate(){
  if(!tg||!tg.initData)throw new Error('Откройте через Telegram');
  const a=await api('/api/miniapp/auth',{method:'POST',body:JSON.stringify({init_data:tg.initData}),noRetry:true});
  TOKEN=a.token;return TOKEN;
}
function mkErr(status,msg){var e=new Error(msg||('http '+status));e.status=status;return e;}
async function api(path,opts={}){
  const h=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(path,Object.assign({},opts,{headers:h}));
  if(r.status===401&&!opts.noRetry&&!WEB&&tg&&tg.initData){
    await authenticate();
    const h2=Object.assign({'Content-Type':'application/json'},opts.headers||{});
    h2['Authorization']='Bearer '+TOKEN;
    const r2=await fetch(path,Object.assign({},opts,{headers:h2}));
    if(!r2.ok)throw mkErr(r2.status,null);
    return r2.json();
  }
  if(!r.ok){var em=null;try{var j=await r.json();if(j&&j.error)em=j.error;}catch(e){}throw mkErr(r.status,em);}
  return r.json();
}
async function post(path,body){return api(path,{method:'POST',body:JSON.stringify(body||{})});}

/* ---- toast ---- */
let toastT=null;
function toast(msg,kind){
  const t=document.getElementById('toast');
  t.innerHTML=(kind==='ok'?IC.check:kind==='err'?IC.help:'')+'<span>'+esc(msg)+'</span>';
  t.style.color=kind==='err'?'var(--bad)':kind==='ok'?'var(--good)':'var(--text)';
  t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function copyDone(ok){if(ok){haptic('ok');toast('Скопировано','ok');}else{haptic('err');toast('Не удалось скопировать','err');}}
function fallbackCopy(t){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,String(t).length);var ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){copyDone(true);},function(){copyDone(fallbackCopy(t));});
    return;
  }
  copyDone(fallbackCopy(t));
}

// Список подключённых устройств. Обе строки собрал сервер по набору полей из
// админки: тумблеры здесь не разбираются, пустой список = владелец скрыл обзор.
function devicesBlock(s){
  var list=(s&&s.devices)||[];
  if(!list.length)return '';
  var h='<div class="sec-title">'+IC.device+'Подключённые устройства</div><div class="feat">';

    h+='<div class="frow dev"><div class="dn">'+esc(d.name||'')+'</div>'+(d.meta?'<div class="dm">'+esc(d.meta)+'</div>':'')+'</div>';
  });

function gbText(b){
  var gb=(Number(b)||0)/1073741824;
  var s=gb.toFixed(1);
  return (s.slice(-2)==='.0'?s.slice(0,-2):s)+' ГБ';
}
// Add-on ("доп-сервер") state: its nodes are merged into the same subscription
// link, so its traffic must be visible here too — otherwise running out shows up
// only as a stub entry inside the client's server list.
function addSubText(s){
  if(!s.addsub_ok)return null;
  if(s.addsub_off)return 'выкл';
  if(s.addsub_exhausted)return 'исчерпан';
  if(!s.addsub_limit)return 'безлимит';
  var left=Number(s.addsub_limit)-Number(s.addsub_used||0);
  return gbText(left>0?left:0);
}

// showModalConfirm is the in-app confirmation used on the web cabinet (and as a
// fallback in Telegram if tg.showConfirm is unavailable) — a styled dialog in the
// app's own look, instead of the browser's default window.confirm.
function showModalConfirm(msg,cb,opts){
  var ov=document.getElementById('cmodal');
  if(!ov){
    ov=document.createElement('div');ov.id='cmodal';ov.className='cmodal';
    ov.innerHTML='<div class="cmodal-card" role="dialog" aria-modal="true"><div class="cmodal-msg"></div><div class="cmodal-btns"><button class="btn sec" data-no></button><button class="btn" data-yes></button></div></div>';
    document.body.appendChild(ov);
  }
  var done=false;
  function finish(v){if(done)return;done=true;ov.classList.remove('show');document.removeEventListener('keydown',onKey);setTimeout(function(){cb(v);},120);}
  function onKey(e){if(e.key==='Escape')finish(false);else if(e.key==='Enter')finish(true);}
  ov.querySelector('.cmodal-msg').textContent=msg;
  var yes=ov.querySelector('[data-yes]'),no=ov.querySelector('[data-no]');

// planTraffic/planDevices/planSub принимают СРОК тарифа (duration): лимиты

function planDevices(d){return !d?'':d.devices>0?(d.devices+' устр.'):d.devices_unlim?'без лимита устройств':'';}
function planSub(d){var x=planDevices(d);return planTraffic(d)+' трафик'+(x?(' · '+x):'');}
function planByCode(c){return (STATE.plans||[]).filter(function(p){return p.code===c;})[0]||null;}
function durByMonths(p,m){return ((p&&p.durations)||[]).filter(function(d){return d.months==m;})[0]||null;}
function planTitle(p){return (p.icon?p.icon+' ':'')+(p.name||p.code);}

function planCardSub(p){

}
// «от X ₽» — минимальная цена по срокам тарифа. Пробелы-разделители тысяч
// убираются до разбора: parseFloat('9 900') вернул бы 9.
function planMinLabel(p){

  (p.durations||[]).forEach(function(d){

// Браузер пускает новую вкладку только прямо в обработчике нажатия, а не

function payTab(){if(!WEB)return null;try{var w=window.open('','_blank');if(w){try{w.opener=null;}catch(e){}}return w;}catch(e){return null;}}
function payTabGo(w,u){if(!w||w.closed||!/^(https?:|tg:)/i.test(String(u||'')))return false;try{w.location.href=u;return true;}catch(e){return false;}}
function payTabDrop(w){try{if(w&&!w.closed)w.close();}catch(e){}}
async function pay(plan,months,method,el,shownPrice){
  haptic('tap');busy(el,true);
  var tab=(method==='balance'||method==='p2p')?null:payTab();
  // p2p_inapp: реквизиты перевода и чек принимаются прямо здесь, а не в чате.
  try{const r=await post('/api/miniapp/checkout',{plan:plan,months:months,method:method,price:shownPrice||'',p2p_inapp:true});
    if(r.ok&&r.pay_url&&payTabGo(tab,r.pay_url)){tab=null;openWait(r.pay_url,r.issued_at);return;}
    if(r.ok&&r.sub_url){haptic('ok');boot();return;}
    if(r.ok&&r.p2p_card){if(r.message)toast(r.message,'ok');renderP2PCard(r.p2p_card,r.p2p_amount,r.p2p_req_id,r.p2p_topup);return;}
    if(r.ok&&r.pay_url){
      payGuardOn();
      if(r.invoice&&tg&&tg.openInvoice){
        tg.openInvoice(r.pay_url,function(st){payGuardOff();if(st==='paid')boot();});
      }else{openPay(r.pay_url);openWait(r.pay_url,r.issued_at);}
      return;
    }
    if(r.redirect){toast(r.message||'Этот способ оплаты доступен в боте','ok');if(tg&&tg.close)setTimeout(function(){try{tg.close();}catch(e){}},2200);return;}
    haptic('err');toast(r.error||'Не удалось оплатить','err');
  }catch(e){haptic('err');toast('Ошибка: '+e.message,'err');}
  finally{payTabDrop(tab);busy(el,false);}
}

/* ---- ожидание оплаты ---- */
// Пока открыта страница оплаты, экран сам спрашивает сервер (тот сверяет счёт
// с платёжкой) и уходит на главную, как только оплата прошла.
var WAIT=null;
function stopWait(){if(WAIT){clearInterval(WAIT.t);document.removeEventListener('visibilitychange',WAIT.v);WAIT=null;}}
// issuedAt — когда сервер выставил счёт (unix): проверка спрашивает, была ли
// оплата после него, — так видна и оплата, которую уже провёл вебхук.
function openWait(url,issuedAt){
  var h='<div class="stagger"><div class="card hero glow"><div class="top"><span class="status"><span class="dot"></span>Оплата</span>'+IC.wallet+'</div>'+
    '<div class="title">Ждём оплату</div><div class="hint" style="margin-top:6px">Завершите оплату на открывшейся странице. Как только платёж пройдёт, всё обновится само — эту страницу можно не закрывать.</div></div>';
  h+='<button class="btn" onclick="payCheck(this,true)">'+IC.reset+'Проверить оплату</button>';
  if(url)h+='<button class="btn sec" style="margin-top:10px" onclick="openPay(\''+jsq(url)+'\')">'+IC.wallet+'Открыть оплату ещё раз</button>';
  h=deskSplit(h,'');
  h+='<button class="btn ghost back" style="margin-top:10px" onclick="boot()">← На главную</button></div>';
  view(h,boot);
  var w={since:issuedAt||0,n:0};
  // Через 3 минуты автопроверка стихает, кнопка «Проверить оплату» работает дальше.
  w.t=setInterval(function(){if(document.hidden)return;if(++w.n>30){clearInterval(w.t);return;}payCheck(null,false);},6000);
  w.v=function(){if(!document.hidden)setTimeout(function(){if(WAIT===w)payCheck(null,false);},700);};
  document.addEventListener('visibilitychange',w.v);
  WAIT=w;
}
async function payCheck(el,manual){
  var w=WAIT;if(!w)return;
  if(el)busy(el,true);
  try{var r=await post('/api/miniapp/paycheck',{since:w.since});
    if(WAIT!==w)return;
    if(r.paid){stopWait();haptic('ok');toast('Оплата получена','ok');boot();return;}
    if(manual){haptic('err');toast(r.error||'Оплата пока не поступила. Если вы уже оплатили, подождите минуту.','err');}
  }catch(e){if(manual){haptic('err');toast('Ошибка: '+e.message,'err');}}
  finally{if(el)busy(el,false);}
}

/* ---- connect (apps + deeplinks + QR) ---- */
var CONNECT=null,CONNECT_KEY='';
function detectOS(){
  try{var p=(tg&&tg.platform)||'';if(p==='ios')return 'ios';if(p==='android')return 'android';if(p==='windows')return 'windows';if(p==='linux')return 'linux';if(p==='macos')return WEB?'macos':'ios';}catch(e){}
  var ua=(navigator.userAgent||'').toLowerCase();
  if(/iphone|ipad|ipod/.test(ua))return 'ios';
  if(/android/.test(ua))return 'android';
  if(/windows|win64|win32/.test(ua))return 'windows';
  if(/mac os|macintosh/.test(ua))return WEB?'macos':'ios';
  if(/linux|x11|cros/.test(ua))return 'linux';
  return WEB?'windows':'android';
}
// all platforms the backend returned (with a legacy ios/android fallback)
function cnPlatforms(){
  if(CONNECT&&CONNECT.platforms&&CONNECT.platforms.length)return CONNECT.platforms;
  var out=[];
  if(CONNECT&&CONNECT.android&&CONNECT.android.length)out.push({key:'android',label:'Android',apps:CONNECT.android});
  if(CONNECT&&CONNECT.ios&&CONNECT.ios.length)out.push({key:'ios',label:'iPhone / iOS',apps:CONNECT.ios});
  return out;
}
function curPlatform(){var ps=cnPlatforms();for(var i=0;i<ps.length;i++)if(ps[i].key===CONNECT_KEY)return ps[i];return ps[0]||null;}
function connectList(){var p=curPlatform();return (p&&p.apps)||[];}
// Клиентский разбор конфига приложений удалён: он дублировал серверный
// (App.MiniConnect), никогда не вызывался, и всё равно не сработал бы —
// это кросс-доменный запрос к странице подписки без CORS. Пустой ответ
// сервера уже обработан внятно: «скопируйте ссылку и добавьте вручную».
async function openConnect(){
  PAGE='connect';
  haptic('tap');skSimple();setBack(boot);
  try{
    var d=await api('/api/miniapp/connect');CONNECT=d;
    var ps=cnPlatforms();var want=detectOS();
    CONNECT_KEY=(ps.some(function(p){return p.key===want;})?want:((ps[0]&&ps[0].key)||''));
    renderConnect();
  }catch(e){haptic('err');toast('Ошибка: '+e.message,'err');boot();}
}
function setPlat(key){haptic('tap');CONNECT_KEY=key;renderConnect();}
function drawQR(text){
  if(!text)return;
  var el=document.getElementById('qrbox');if(!el)return;
  try{
    if(typeof qrcode==='undefined'){var w=document.getElementById('qrwrap');if(w)w.style.display='none';return;}
    var qr=qrcode(0,'M');qr.addData(text);qr.make();
    el.innerHTML=qr.createSvgTag({cellSize:4,margin:1,scalable:true});
    var svg=el.querySelector('svg');if(svg){svg.removeAttribute('width');svg.removeAttribute('height');svg.style.width='150px';svg.style.height='150px';svg.style.display='block';}
  }catch(e){var w=document.getElementById('qrwrap');if(w)w.style.display='none';}
}
function renderConnect(){
  var d=CONNECT||{};
  var h='<div class="stagger"><div class="card hero glow"><div class="top"><span class="status">'+IC.download+' Подключение</span>'+IC.globe+'</div>'+
    '<div class="title">Установите приложение</div><div class="hint" style="margin-top:4px">Установите приложение и нажмите «Добавить подписку» — она импортируется сама.</div>';
  if(d.sub_url)h+='<div id="qrwrap" style="display:flex;flex-direction:column;align-items:center;margin-top:16px"><div id="qrbox" class="qrbox"></div>'+
    '<div class="hint center" style="margin-top:8px">Наведите камеру другого устройства, чтобы перенести подписку</div></div>';
  h+='</div>';
  // На компьютере ссылку часто вставляют в программу вручную — кнопка нужна и
  // при списке приложений.
  if(DESK&&d.sub_url&&connectList().length)h+='<button class="btn sec" style="margin-top:0" onclick="copy(\''+jsq(d.sub_url)+'\')">'+IC.copy+'Скопировать ссылку</button>';
  var hl=h;h='';
  var ps=cnPlatforms();
  if(ps.length>1){
    h+='<div class="seg">';
    ps.forEach(function(p){h+='<button class="segbtn'+(p.key===CONNECT_KEY?' on':'')+'" onclick="setPlat(\''+jsq(p.key)+'\')">'+esc(p.label)+'</button>';});
    h+='</div>';
  }
  var list=connectList();
  var grid=list.length>1;
  if(!list.length){
    h+='<div class="hint center" style="margin-top:16px">Список приложений недоступен. Скопируйте ссылку и добавьте её в приложение вручную.</div>';
    if(d.sub_url)h+='<button class="btn sec" style="margin-top:10px" onclick="copy(\''+jsq(d.sub_url)+'\')">'+IC.copy+'Скопировать ссылку</button>';
  }
  if(grid)h+='<div class="cols">';
  list.forEach(function(ap){
    h+='<div class="appc'+(ap.featured?' feat':'')+'"><div class="apphead"><span class="appname">'+esc(ap.name)+(ap.featured?'<span class="fbadge">Рекомендуем</span>':'')+'</span></div>';
    if(ap.add_desc)h+='<div class="appdesc">'+esc(ap.add_desc)+'</div>';
    if(ap.deeplink)h+='<button class="btn" onclick="openDeep(\''+jsq(ap.deeplink)+'\')">'+IC.plus+'Добавить подписку</button>';
    (ap.installs||[]).forEach(function(b){
      h+='<button class="btn sec" onclick="openL(\''+jsq(b.url)+'\')">'+IC.download+esc(b.text||'Установить')+'</button>';
    });
    h+='</div>';
  });
  if(grid)h+='</div>';
  h=deskSplit(hl,h);
  h+='<button class="btn ghost back" style="margin-top:16px" onclick="boot()">← Назад</button></div>';
  view(h,boot);
  drawQR(d.sub_url);
}

      '<div class="hint" style="margin-top:6px">Привязка возможна, только если у этого Telegram ещё нет аккаунта в боте.</div>'+
      '<div class="tgwrap" style="margin-top:12px"><div id="tgbind"></div></div></div>';
  }
  var hl=h;h='';
  if(a.has_password){
    h+='<div class="sec-title">'+IC.tag+'Сменить пароль</div><div class="card">'+
      '<input id="pwOld" class="field" type="password" placeholder="Текущий пароль" autocomplete="current-password">'+
      '<input id="pwNew" class="field" style="margin-top:10px" type="password" placeholder="Новый пароль (мин. 8)" autocomplete="new-password">'+
      '<input id="pwNew2" class="field" style="margin-top:10px" type="password" placeholder="Новый пароль ещё раз" autocomplete="new-password">'+
      '<button class="btn" style="margin-top:10px" onclick="changePass(this)">'+IC.check+'Сменить пароль</button>'+
      '<div class="hint" style="margin-top:8px;font-size:12px">Все остальные входы в этот аккаунт будут завершены.</div></div>';
  }
  if(DESK&&!h)h='<div class="card"><b>Выход</b><div class="hint" style="margin-top:6px">Завершить вход в кабинет на этом устройстве. Подписка и баланс останутся, войти снова можно через Telegram.</div>'+
    '<button class="btn sec" style="margin-top:14px" onclick="cabLogout()">'+IC.login+'Выйти</button></div>';
  h=deskSplit(hl,h);
  h+='<button class="btn ghost back" style="margin-top:16px" onclick="openMore()">← Назад</button></div>';
  view(h,openMore);
  if(!a.tg_linked)mountTGWidget('tgbind','onTGBind','Привязать Telegram');
}
// mountTGWidget ставит кнопку входа Telegram. Мест два — вход и привязка;
// fn — имя обработчика, он получает тело запроса на сервер. Способ входа
// выбирает админ: новая библиотека telegram-login.js (в ответе конфига есть
// client_id) или прежний виджет telegram-widget.js — Telegram выключает его
// только ботам, у которых в @BotFather включён новый способ.
// TG_V — verifier по nonce: окно Telegram, открытое до перерисовки кнопки,
// вернёт токен со старым nonce, и verifier берётся по нему, а не последний.
var TG_CFG=null,TG_LIB=null,TG_V={};
function tgLoginLib(){
  if(!TG_LIB)TG_LIB=new Promise(function(ok,no){
    var sc=document.createElement('script');sc.async=true;sc.src='https://oauth.telegram.org/js/telegram-login.js';
    sc.onload=function(){if(window.Telegram&&Telegram.Login)ok(Telegram.Login);else{TG_LIB=null;no();}};
    sc.onerror=function(){TG_LIB=null;no();};
    document.head.appendChild(sc);
  });
  return TG_LIB;
}
// tgNonce — пара verifier/nonce: nonce уходит в Telegram и попадает в токен,
// verifier — только на наш сервер. Без verifier перехваченный токен не годится.
function tgNonce(){
  try{
    if(!(window.crypto&&crypto.subtle&&crypto.getRandomValues&&window.TextEncoder))return Promise.resolve({v:'',n:''});
    var b=new Uint8Array(32);crypto.getRandomValues(b);
    var v=btoa(String.fromCharCode.apply(null,b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(h){
      return {v:v,n:Array.prototype.map.call(new Uint8Array(h),function(x){return ('0'+x.toString(16)).slice(-2);}).join('')};
    },function(){return {v:'',n:''};});
  }catch(e){return Promise.resolve({v:'',n:''});}
}
function mountTGWidget(elID,fn,label){
  var put=function(c){
    var m=document.getElementById(elID);if(!m||!c)return;
    if(c.client_id){
      Promise.all([tgLoginLib(),tgNonce()]).then(function(x){
        var L=x[0],p=x[1],m=document.getElementById(elID);if(!m)return;
        m.innerHTML='<button type="button" class="tg-auth-button">'+esc(label)+'</button>';
        var o={client_id:c.client_id,request_access:['write'],lang:'ru'};if(p.n){o.nonce=p.n;TG_V[p.n]=p.v;}
        L.init(o,function(r){
          if(r&&r.id_token){window[fn]({id_token:r.id_token,verifier:(r.user&&TG_V[r.user.nonce])||p.v});return;}
          if(r&&r.error&&r.error!=='popup_closed')toast('Не удалось войти через Telegram','err');
        });
      },function(){var m=document.getElementById(elID);if(m)m.innerHTML='<div class="hint">Вход через Telegram сейчас недоступен</div>';});
      return;
    }
    if(!c.bot_username)return;
    var sc=document.createElement('script');sc.async=true;sc.src='https://telegram.org/js/telegram-widget.js?22';
    sc.setAttribute('data-telegram-login',c.bot_username);sc.setAttribute('data-size','large');
    sc.setAttribute('data-onauth',fn+'(user)');sc.setAttribute('data-request-access','write');
    m.appendChild(sc);
  };
  if(TG_CFG){put(TG_CFG);return;}
  api('/api/cabinet/config').then(function(c){TG_CFG=c;put(c);},function(){});
}
window.onTGBind=function(body){
  post('/api/cabinet/tg/bind',body).then(function(r){
    if(r&&r.token){TOKEN=r.token;setStoredToken(r.token);haptic('ok');toast('Telegram привязан','ok');STATE.acct=null;boot();return;}
    toast('Не удалось привязать','err');
  }).catch(function(e){haptic('err');toast(e.message||'Не удалось привязать','err');});
};
async function changePass(el){
  var o=document.getElementById('pwOld'),n=document.getElementById('pwNew'),n2=document.getElementById('pwNew2');
  var ov=o?o.value:'',nv=n?n.value:'',n2v=n2?n2.value:'';
  if(!ov||!nv){toast('Заполните оба поля','err');return;}
  if(nv!==n2v){toast('Новые пароли не совпадают','err');return;}
  if(nv.length<8){toast('Пароль слишком короткий','err');return;}
  haptic('tap');busy(el,true);
  try{
    var r=await post('/api/cabinet/password/change',{old:ov,new:nv});
    // Поколение пропусков поднялось — прежний пропуск ЭТОЙ вкладки тоже мёртв,
    // поэтому меняем его на присланный, иначе следующий же запрос даст 401.
    if(r&&r.token){TOKEN=r.token;setStoredToken(r.token);}
    haptic('ok');toast('Пароль изменён','ok');openAccount();return;
  }catch(e){haptic('err');toast(e.message||'Не удалось','err');}
  busy(el,false);
}
/* ---- ссылки из писем ---- */
// Значение приходит параметром, а запрос уходит POST'ом: GET-ссылку на
// изменение состояния открывают почтовые антивирусы и «проверялки», и человек
// добирается уже до погашенной ссылки.
function linkParam(name){
  try{return new URLSearchParams(window.location.search).get(name)||'';}catch(e){return '';}
}
function dropQuery(){
  try{window.history.replaceState({},'',window.location.pathname);}catch(e){}
}
async function runVerifyLink(tok){
  dropQuery();
  try{await post('/api/cabinet/email/verify',{token:tok});toast('Адрес подтверждён','ok');}
  catch(e){toast(e.message||'Ссылка недействительна','err');}
  STATE.acct=null;
}
function openReset(tok){
  PAGE=null;
  setBack(null);
  balchip.style.display='none';balchip.innerHTML='';
  var h='<div class="stagger"><div class="authwrap"><div class="card hero glow authcard"><div class="top"><span class="status">'+IC.login+' Новый пароль</span></div>'+
    '<div class="title">Личный кабинет</div><div class="hint" style="margin-top:6px">Задайте новый пароль для входа.</div></div>'+
    '<div class="card">'+
    '<input id="rsPass" class="field" type="password" placeholder="Новый пароль (мин. 8)" autocomplete="new-password">'+
    '<input id="rsPass2" class="field" style="margin-top:10px" type="password" placeholder="Ещё раз" autocomplete="new-password">'+
    '<button class="btn" style="margin-top:10px" onclick="doReset(this,\''+jsq(tok)+'\')">'+IC.check+'Сохранить</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="renderLogin()">← К входу</button></div></div></div>';
  view(h,null);
}
async function doReset(el,tok){
  var p=document.getElementById('rsPass'),p2=document.getElementById('rsPass2');
  var v=p?p.value:'',v2=p2?p2.value:'';
  if(v!==v2){toast('Пароли не совпадают','err');return;}
  if(v.length<8){toast('Пароль слишком короткий','err');return;}
  haptic('tap');busy(el,true);
  try{
    var r=await post('/api/cabinet/password/reset',{token:tok,password:v});
    if(r&&r.token){TOKEN=r.token;setStoredToken(r.token);haptic('ok');toast('Пароль изменён','ok');STATE.acct=null;boot();return;}
    toast('Не удалось','err');
  }catch(e){haptic('err');toast(e.message||'Ссылка недействительна','err');}
  busy(el,false);
}
function openForgot(){
  PAGE=null;
  setBack(null);
  var h='<div class="stagger"><div class="authwrap"><div class="card hero glow authcard"><div class="top"><span class="status">'+IC.login+' Восстановление</span></div>'+
    '<div class="title">Личный кабинет</div><div class="hint" style="margin-top:6px">Пришлём ссылку на смену пароля.</div></div>'+
    '<div class="card">'+
    '<input id="fgEmail" class="field" type="email" placeholder="Email" autocomplete="email">'+
    '<button class="btn" style="margin-top:10px" onclick="doForgot(this)">'+IC.check+'Отправить</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="renderLogin()">← К входу</button></div></div></div>';
  view(h,null);
}
async function doForgot(el){
  var e=document.getElementById('fgEmail');var v=e?e.value.trim():'';
  if(!v){toast('Введите email','err');return;}
  haptic('tap');busy(el,true);
  try{await post('/api/cabinet/password/forgot',{email:v});}catch(err){}
  // Ответ одинаков всегда и намеренно: иначе форма превращается в проверялку
  // «а есть ли у вас аккаунт с таким адресом».
  busy(el,false);
  toast('Если такой адрес есть, письмо отправлено','ok');
}

/* ---- web cabinet login ---- */
function cabVal(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function cabLogout(){clearToken();renderLogin();}
async function renderLogin(){
  PAGE=null;renderSide();
  // Первая загрузка: скелет главной меняется на скелет формы входа, пока
  // грузятся настройки, — иначе на экране входа мелькает чужая раскладка.
  if(NOFX)app.innerHTML='<div class="authwrap"><div class="sk sk-hero" style="height:118px"></div><div class="sk sk-row" style="height:320px"></div></div>';
  setBack(null);
  balchip.style.display='none';balchip.innerHTML='';
  STATE={balanceK:0,methods:[]};
  var cfg={};try{cfg=await api('/api/cabinet/config');}catch(e){}
  var h='<div class="stagger"><div class="authwrap"><div class="card hero glow authcard"><div class="top"><span class="status">'+IC.login+' Вход</span></div>'+
    '<div class="title">Личный кабинет</div><div class="hint" style="margin-top:6px">Войдите через Telegram или по email.</div></div>';
  if(cfg.client_id||cfg.bot_username)h+='<div class="sec-title">'+IC.bolt+'Через Telegram</div><div class="tgwrap"><div id="tglogin"></div></div>';
  h+='<div class="sec-title">'+IC.tag+'По email</div><div class="card">'+
    '<input id="lemail" class="field" type="email" placeholder="Email" autocomplete="email">'+
    '<input id="lpass" class="field" style="margin-top:10px" type="password" placeholder="Пароль (мин. 8)" autocomplete="current-password">'+
    '<button class="btn" style="margin-top:10px" onclick="cabLogin(this)">'+IC.check+'Войти</button>'+
    '<button class="btn sec" style="margin-top:10px" onclick="cabRegister(this)">'+IC.plus+'Зарегистрироваться</button>';
  if(cfg.mail_on){
    h+='<button class="btn ghost" style="margin-top:10px" onclick="openForgot()">Забыли пароль?</button>'+
      '<div class="hint" style="margin-top:8px;font-size:12px">После регистрации на адрес придёт письмо. Пока адрес не подтверждён, оплата и пополнение недоступны.</div>';
  }else{
    h+='<div class="hint" style="margin-top:8px;font-size:12px">Регистрация без подтверждения почты. Восстановление пароля недоступно — сохраните пароль.</div>';
  }
  h+='</div>';
  h+='</div></div>';
  view(h,null);
  if(cfg.client_id||cfg.bot_username){TG_CFG=cfg;mountTGWidget('tglogin','onTGAuth','Войти через Telegram');}
}
window.onTGAuth=function(user){renderLoginBusy();var body=Object.assign({},user);var st=serverStart(lsGet('cab_start'));if(st)body.start=st;post('/api/cabinet/auth/telegram',body).then(function(r){if(r&&r.token){TOKEN=r.token;setStoredToken(r.token);boot();}else{toast('Не удалось войти','err');renderLogin();}}).catch(function(e){toast(e.message||'Ошибка входа','err');renderLogin();});};
function renderLoginBusy(){skSimple();}
async function cabEmail(path,el){
  var email=cabVal('lemail'),pass=cabVal('lpass');
  if(!email||!pass){toast('Заполните email и пароль','err');return;}
  haptic('tap');busy(el,true);
  // Регистрация несёт параметр ссылки: по нему новичок привязывается к
  // пригласившему (вход его не использует).
  var body={email:email,password:pass};if(path.indexOf('/register')>0){var st=serverStart(lsGet('cab_start'));if(st)body.start=st;}
  try{var r=await post(path,body);if(r&&r.token){TOKEN=r.token;setStoredToken(r.token);boot();return;}toast('Не удалось','err');}
  catch(e){toast(e.message||'Ошибка','err');}
  busy(el,false);
}
function cabLogin(el){cabEmail('/api/cabinet/auth/login',el);}
function cabRegister(el){cabEmail('/api/cabinet/auth/register',el);}

/* ---- вход по ссылке ---- */
// promo_ и plan_ разбираются здесь; ref_ и inv_ — на сервере при входе.
async function handleStart(s){
  var t=String(s||'').split('\n');
  var promo=t.filter(function(x){return x.indexOf('promo_')===0;})[0];
  var plan=t.filter(function(x){return x.indexOf('plan_')===0;})[0];
  if(promo){
    var code=promo.slice(6);
    // До подтверждения почты промокод закрыт: ссылка ждёт подтверждения.
    if(WEB&&STATE.acct&&STATE.acct.money_blocked){lsSet('cab_start',promo);if(!STATE.promoWait){STATE.promoWait=true;toast('Подтвердите почту — промокод применится после этого','err');}}
    else if(STATE.menu&&STATE.menu.legal_accept&&legalDocs().length){legalPromoGate(code);return true;}
    else if(!plan){await promoApply(null,code);return true;}
    else await promoApply(null,code,true);
  }
  if(plan){
    try{var r=await api('/api/miniapp/plans?link='+encodeURIComponent(plan.slice(5)));
      if(r.plans&&r.plans.length){var lp=r.plans[0];lp.link=true;
        STATE.plans=(STATE.plans||[]).filter(function(x){return x.code!==lp.code;}).concat([lp]);
        openPlan(lp.code);return true;}
      toast(r.notice||'Тариф по этой ссылке недоступен','err');
    }catch(e){toast('Ошибка: '+e.message,'err');}
  }
  return false;
}
function legalPromoGate(code){
  PAGE='wallet';
  STATE.legalBack=function(){legalPromoGate(code);};
  var h='<div class="stagger"><div class="card hero glow"><div class="top"><span class="status">📜 Документы</span></div>'+
    '<div class="title">Перед промокодом</div>'+
    '<div class="hint" style="margin-top:8px">Ознакомьтесь с документами сервиса — согласие нужно дать один раз. Затем применим промокод.</div></div>';
  h+=legalRows();
  h+='<button class="btn" style="margin-top:12px" onclick="legalAccept(this,function(){promoApply(null,\''+jsq(code)+'\');})">✅ Принимаю</button>';
  h+='<button class="btn ghost back" style="margin-top:10px" onclick="boot()">← Назад</button></div>';
  view(h,boot);
}

/* ---- boot ---- */
async function boot(){
  setBack(null);
  payGuardOff();
  try{
    var start='';
    if(WEB){
      // Параметр ссылки хранится до входа: вход через Telegram и регистрация
      // берут его оттуда.
      var sp=startParams();if(sp)lsSet('cab_start',sp);
      // Ссылки из писем разбираются до всего остального: человек мог прийти по
      // ним, ещё не будучи залогиненным, и до кабинета ему тогда не добраться.
      var vTok=linkParam('verify');
      if(vTok)await runVerifyLink(vTok);
      var rTok=linkParam('reset');
      if(rTok){dropQuery();openReset(rTok);return;}
      if(sp)dropQuery();
      if(!TOKEN)TOKEN=getStoredToken();
      if(!TOKEN){NOFX=true;renderLogin();return;}
      start=lsGet('cab_start')||'';
    }else if(!tg||!tg.initData){view('<div class="card err">Откройте через Telegram.</div>',null);return;}
    else if(!STATE.startDone){STATE.startDone=true;try{start=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';}catch(e){}}
    PAGE='home';skMain();renderSide();
    if(!WEB)await authenticate();
    const [me,menu,sub,plans]=await Promise.all([
      api('/api/miniapp/me'),api('/api/miniapp/menu'),
      api('/api/miniapp/subscription'),api('/api/miniapp/plans')]);
    try{STATE.ap=await api('/api/miniapp/autopay');}catch(e){STATE.ap=null;}
    // Состояние аккаунта нужно на главной: пока адрес не подтверждён, оплата
    // закрыта, и человек обязан увидеть почему — иначе кнопка просто «не
    // работает».
    if(WEB){try{STATE.acct=await api('/api/cabinet/account');}catch(e){STATE.acct=null;}}
    STATE.me_id=me.tg_id||0;loadAva();
    STATE.balanceK=me.balance_kopecks||0; STATE.methods=menu.pay_methods||[]; STATE.menu=menu; STATE.lang=me.lang||'ru'; STATE.me_name=me.name||''; STATE.me_email=me.email||''; STATE.me_subexp=me.sub_expire||'';
    balchip.style.display='inline-flex';
    balchip.innerHTML=IC.wallet+rub(STATE.balanceK)+' ₽';
    NOFX=true;render(me,menu,sub,plans);NOFX=false;
    // Ссылка ждёт согласия с документами на входе: после «Принимаю» boot()
    // вызовется снова. В кабинете она до тех пор лежит в localStorage и
    // переживает перезагрузку; снимается, только когда кабинет загрузился
    // (с протухшим входом дождётся нового).
    var gate=!!(menu.legal_accept&&menu.legal_gate_start&&legalDocs().length);
    if(!WEB&&start)STATE.pendingStart=start;
    if(!gate){
      if(WEB)lsSet('cab_start',null);
      var ps=WEB?start:STATE.pendingStart;STATE.pendingStart='';
      if(ps)await handleStart(ps);
    }
  }catch(e){if(WEB&&e.status===401){clearToken();NOFX=true;renderLogin();return;}if(!STATE.menu)PAGE=null;view('<div class="card err">Не удалось загрузить: '+esc(e.message)+'</div>',null);}
}
boot();
