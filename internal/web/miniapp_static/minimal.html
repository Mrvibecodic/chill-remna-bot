<title>Кабинет</title>

<script>
/* Тема ставится до первой отрисовки: иначе страница моргнёт чужой темой. */
(function(){
  var B=window.BRAND||{},pref='';
  try{pref=localStorage.getItem('ui_theme')||'';}catch(e){}
  if(pref!=='light'&&pref!=='dark'&&pref!=='auto')pref=B.theme||'auto';
  var t=pref;
  if(t==='auto'){
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg&&tg.colorScheme)t=tg.colorScheme;
    else t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
})();
</script>

<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#0f1115;--muted:#667085;--faint:#98a2b3;--line:#e4e7ec;--soft:#eef0f3;--off:#b9c0cb;
  --accent:#2f6bff;--on-accent:#fff;--acc-ink:#2f6bff;--ok:#067647;--bad:#b42318;--warn:#b54708;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --top-bg:rgba(244,245,247,.88);--ok-soft:#ecfdf3;--bad-soft:#fef3f2;--warn-soft:#fffaeb;--warn-line:#fedf89;--acc-soft:rgba(47,107,255,.10);--shimmer:rgba(15,17,21,.05);
  --r:18px;--r-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d0e11;--card:#17191e;--text:#f1f3f6;--muted:#9aa1ad;--faint:#6b7280;--line:#262930;--soft:#1f2228;--off:#4a505b;
  --accent:#5b8dff;--acc-ink:#7aa2ff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
  --shadow:none;color-scheme:dark;
  --top-bg:rgba(13,14,17,.88);--ok-soft:rgba(52,211,153,.14);--bad-soft:rgba(248,113,113,.14);--warn-soft:rgba(251,191,36,.10);--warn-line:rgba(251,191,36,.28);--acc-soft:rgba(91,141,255,.16);--shimmer:rgba(241,243,246,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;overflow-x:hidden;
  transition:background-color .2s,color .2s}
button,input{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none;vertical-align:middle}
a{color:var(--acc-ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(var(--safe-bot) + 28px)}
body.web .wrap{max-width:980px}

/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--top-bg);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(var(--safe-top) + 10px) 16px 10px}
body.web .top .in{max-width:980px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.brand img{height:28px;max-width:150px;width:auto;object-fit:contain;display:block}
.brand .nm{font-weight:700;font-size:17px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-d{display:none!important}
:root[data-theme="dark"] .has-dark .logo-l{display:none!important}
:root[data-theme="dark"] .has-dark .logo-d{display:block!important}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px;color:var(--muted)}
.ibtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.ibtn svg{width:18px;height:18px}

/* появление экрана */
#app{animation:vin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* карточки и списки */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.h1{font-size:26px;font-weight:750;letter-spacing:-.5px;line-height:1.15}
.h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sect{font-size:13px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{color:var(--muted);font-size:13.5px;margin-top:8px}
.center{text-align:center}
.stack>*+*{margin-top:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:54px;width:100%;
  background:none;border:0;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--soft)}
.item .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.item .ic svg{width:18px;height:18px}
.item .tx{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted);margin-top:1px}
.item .v{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .chev{color:var(--faint);width:18px;height:18px}
.item.static{cursor:default}.item.static:active{background:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:14.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;border:0;
  background:var(--accent);color:var(--on-accent);font-weight:650;font-size:15.5px;cursor:pointer;transition:transform .1s,opacity .15s;padding:0 16px}
.btn:active{transform:scale(.985)}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);height:42px}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn[disabled]{opacity:.55;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:14.5px;background:none;border:0;cursor:pointer;padding:14px 0 2px}
.back svg{width:18px;height:18px}

/* подписка */
.sub .st{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.badge .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok);background:var(--ok-soft)}
.badge.bad{color:var(--bad);background:var(--bad-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.acc{color:var(--acc-ink);background:var(--acc-soft)}
.days{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px}
.days b{font-size:44px;font-weight:750;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.days span{color:var(--muted);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--muted);font-size:13.5px}
.meta b{color:var(--text);font-weight:650}
.link{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--soft);cursor:pointer}
.link code{flex:1;min-width:0;font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.link svg{width:16px;height:16px;color:var(--muted)}
.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;background:var(--soft);border-radius:12px;padding:12px}
.note{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--text)}
.note b{color:var(--warn)}
.note .btn.sec{background:var(--card);border:1px solid var(--warn-line)}
.note.info{background:var(--card);border-color:var(--line)}

/* тарифы */
.plan{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px;cursor:pointer;box-shadow:var(--shadow)}
.plan:active{transform:scale(.99)}
.plan .pt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.plan .pn{font-weight:700;font-size:16.5px}
.plan .pp{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.plan .pd{color:var(--muted);font-size:13.5px;margin-top:4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--acc-ink)}
.opt.on .rd{border-color:var(--acc-ink)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc-ink)}
.opt .tx{flex:1;min-width:0}
.opt .t{font-weight:650}
.opt .s{font-size:12.5px;color:var(--muted)}
.opt .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:600;border:1.5px solid transparent;cursor:default}
button.chip{cursor:pointer}
.chip.on{border-color:var(--acc-ink);color:var(--acc-ink);background:var(--acc-soft)}
.flag{width:20px;height:14px;border-radius:3px;object-fit:cover}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.field{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15.5px;outline:none}
.field:focus{border-color:var(--acc-ink)}
input[type=file].field{padding:12px;height:auto}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin-top:12px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:80px;height:36px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--off);position:relative;flex:none;transition:background .2s;border:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.qr{display:flex;justify-content:center;margin-top:14px}
.qr div{background:#fff;padding:10px;border-radius:14px;line-height:0}
.legal{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.legal p+p{margin-top:8px}
.big{font-size:40px;font-weight:750;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.hero-logo{display:flex;justify-content:center;margin:26px 0 6px}
.hero-logo img{height:48px;max-width:220px;object-fit:contain}
.tgw{display:flex;justify-content:center;min-height:48px;margin-top:12px}

/* скелетоны, всплывашки, диалог */
.sk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--shimmer),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 20px);transform:translate(-50%,16px);max-width:92vw;background:var(--text);color:var(--bg);
  padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.modal.show{display:flex}
.modal .box{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line)}
.modal .msg{white-space:pre-line;font-size:15px;margin-bottom:16px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc-ink);animation:rot 1s linear infinite;margin:6px auto 0}
@keyframes rot{to{transform:rotate(360deg)}}

@media(min-width:760px){
  body.web .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}
  body.web .plans-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
  body.web .narrow{max-width:520px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function T(k){var d=L[STATE.lang]||L.ru;var s=(k in d)?d[k]:(L.ru[k]||k);for(var i=1;i<arguments.length;i++)s=s.replace('%s',arguments[i]);return s;}
function plural(n,a,b,c){if(STATE.lang==='en')return Math.abs(n)===1?a:c;n=Math.abs(n)%100;var d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
function monthsW(n){return n+' '+plural(n,T('month1'),T('month2'),T('month5'));}
function daysW(n){return plural(n,T('day1'),T('day2'),T('day5'));}

/* ---------- утилиты ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'\\n').replace(/\r/g,'\\r');}
function loc(){return STATE.lang==='en'?'en-US':'ru-RU';}
function rub(k){return (Math.round(k)/100).toLocaleString(loc())+' ₽';}
function num(s){var v=parseFloat(String(s==null?'':s).replace(/[\s\u00a0]/g,'').replace(',','.'));return isFinite(v)?v:NaN;}
function price(d){return (String(d.price||'')+' '+(d.currency||'')).trim();}
function daysLeft(ts){var d=Math.ceil((ts*1000-Date.now())/86400000);return d>0?d:0;}
function dateS(ts){var d=new Date(ts*1000),p=function(n){return(n<10?'0':'')+n;};return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear();}
function haptic(k){try{if(tg&&tg.HapticFeedback){if(k==='ok')tg.HapticFeedback.notificationOccurred('success');else if(k==='err')tg.HapticFeedback.notificationOccurred('error');else tg.HapticFeedback.impactOccurred('light');}}catch(e){}}
function busy(el,on){if(el&&el.tagName)el.disabled=!!on;}
var toastT=null;
function toast(msg,kind){var t=document.getElementById('toast');t.innerHTML=(kind==='ok'?IC.check:kind==='err'?IC.help:'')+'<span>'+esc(msg)+'</span>';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2800);if(kind)haptic(kind);}
function fallbackCopy(t){try{var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();a.setSelectionRange(0,String(t).length);var ok=document.execCommand('copy');document.body.removeChild(a);return ok;}catch(e){return false;}}
function copy(t){var done=function(ok){toast(ok?T('copied'):T('copy_fail'),ok?'ok':'err');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(fallbackCopy(t));});return;}done(fallbackCopy(t));}

/* Фирменный цвет с поправкой на тему. Контраст считается по WCAG: текст на
   кнопке — тот из тёмного и белого, что читается лучше; «чернила» (текст,
   рамки и отметки цветом бренда) затемняются на светлой теме и высветляются на
   тёмной, пока не наберут 4.5:1 к своей подложке. Без цвета из админки
   поправка применяется к цвету дизайна. */
function hexRGB(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function lum(c){var v=c.map(function(x){x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);});return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];}
function contrast(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function mixRGB(c,t,k){return c.map(function(v,i){return Math.round(v+(t[i]-v)*k);});}
function rgbHex(c){return '#'+c.map(function(v){return (v<16?'0':'')+v.toString(16);}).join('');}
function applyAccent(dark){
  var a=BRAND.accent,s=document.documentElement.style;
  if(!a||!/^#[0-9a-f]{6}$/i.test(a))a=dark?'#5b8dff':'#2f6bff';
  var card=dark?[23,25,30]:[255,255,255],to=dark?[255,255,255]:[0,0,0];
  var c=hexRGB(a);
  // Кнопка почти цвета фона не видна: такой цвет высветляется или затемняется.
  for(var i=0;i<12&&contrast(c,card)<1.6;i++)c=mixRGB(c,to,0.12);
  var dk=[17,17,17],wh=[255,255,255];
  var on=contrast(c,wh)>=contrast(c,dk)?'#fff':'#111';
  var ink=c,soft;
  for(var j=0;j<20;j++){soft=mixRGB(card,ink,dark?0.16:0.10);if(contrast(ink,soft)>=4.5)break;ink=mixRGB(ink,to,0.1);}
  s.setProperty('--accent',rgbHex(c));s.setProperty('--on-accent',on);
  s.setProperty('--acc-ink',rgbHex(ink));s.setProperty('--acc-soft',rgbHex(soft));
}

function mkErr(st,m){var e=new Error(m||('HTTP '+st));e.status=st;return e;}
async function authenticate(){
  var a=await api('/api/miniapp/auth',{method:'POST',body:JSON.stringify({init_data:tg.initData}),noRetry:true});
  TOKEN=a.token;if(a.notice&&!STATE.noticeShown){STATE.noticeShown=true;setTimeout(function(){toast(a.notice);},400);}return TOKEN;
}
async function api(path,opts){
  opts=opts||{};
  var h=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(TOKEN)h.Authorization='Bearer '+TOKEN;
  var r=await fetch(path,Object.assign({},opts,{headers:h}));
  if(r.status===401&&!opts.noRetry&&!WEB&&tg&&tg.initData){
    await authenticate();
    var h2=Object.assign({},h,{Authorization:'Bearer '+TOKEN});
    r=await fetch(path,Object.assign({},opts,{headers:h2}));
  }
  // Истёкший пропуск кабинета — на вход, а не ошибка на каждом нажатии.
  if(r.status===401&&WEB&&TOKEN&&path.indexOf('/api/cabinet/auth/')<0){logout();throw mkErr(401,T('login'));}
  if(!r.ok){var m=null;try{var j=await r.json();if(j&&j.error)m=j.error;}catch(e){}throw mkErr(r.status,m);}
  return r.json();
}
function post(p,b){return api(p,{method:'POST',body:JSON.stringify(b||{})});}

  if(tg&&tg.initData&&tg.showConfirm){try{tg.showConfirm(msg,function(ok){cb(!!ok);});return;}catch(e){}}

/* Браузер пускает новую вкладку только прямо в обработчике нажатия: после
   ожидания ответа сервера (счёт создаётся не мгновенно) window.open уже
   блокируется. Поэтому в кабинете вкладка открывается сразу по нажатию, а
   адрес оплаты подставляется в неё, когда счёт готов. */
function payTab(){
  if(!WEB)return null;
  try{var w=window.open('','_blank');if(!w)return null;
    try{w.opener=null;w.document.title='…';w.document.body.innerHTML='<p style="font:16px/1.5 system-ui,sans-serif;padding:32px;color:#667085">'+esc(T('opening'))+'</p>';}catch(e){}
    return w;}catch(e){return null;}
}
function payTabGo(w,url){
  if(!w||w.closed||!safeURL(url))return false;
  try{w.location.href=url;return true;}catch(e){return false;}
}
function payTabDrop(w){try{if(w&&!w.closed)w.close();}catch(e){}}
async function pay(code,months,method,el,shown){
  haptic();busy(el,true);
  var tab=(method==='balance'||method==='p2p')?null:payTab();
  try{
    var r=await post('/api/miniapp/checkout',{plan:code,months:months,method:method,price:shown||'',p2p_inapp:true});
    if(r.ok&&r.pay_url&&payTabGo(tab,r.pay_url)){tab=null;guardOn();go('wait',{url:r.pay_url});return;}
    if(r.ok&&r.sub_url){toast(T('paid_ok'),'ok');await refresh();goHome();return;}
    if(r.ok&&r.p2p_card){if(r.message)toast(r.message);go('p2p',{card:r.p2p_card,amount:r.p2p_amount,req:r.p2p_req_id,topup:!!r.p2p_topup},{replace:true});return;}
    if(r.ok&&r.pay_url){
      guardOn();
      if(r.invoice&&tg&&tg.openInvoice){tg.openInvoice(r.pay_url,function(st){guardOff();if(st==='paid'){toast(T('paid_ok'),'ok');refresh().then(goHome,goHome);}});return;}
      if(openSmart(r.pay_url))return;
      go('wait',{url:r.pay_url});return;
    }
    if(r.redirect){toast(r.message||T('pay_fail'));return;}
    toast(r.error||T('pay_fail'),'err');
    if(r.error&&/цен|price/i.test(r.error))refresh().then(rerender,function(){});
  }catch(e){toast(e.message||T('error'),'err');}
  finally{payTabDrop(tab);busy(el,false);}
}

/* ---------- ожидание оплаты ---------- */
function stopPoll(){if(POLL){clearInterval(POLL);POLL=null;}}
SCREENS.wait=function(a){
  var h='<div class="card center" style="margin-top:18px">'+'<div class="spin"></div><div class="h2" style="margin-top:14px">'+esc(T('wait_title'))+'</div><div class="hint">'+esc(T('wait_text'))+'</div>'+
    '<div class="stack" style="margin-top:16px"><button class="btn" onclick="payCheck(this,true)">'+IC.refresh+esc(T('wait_check'))+'</button>'+
    (a&&a.url?'<button class="btn sec" onclick="openL(\''+jsq(a.url)+'\')">'+esc(T('wait_again'))+'</button>':'')+
    '<button class="btn ghost" onclick="guardOff();refresh().then(goHome,goHome)">'+esc(T('home'))+'</button></div></div>';
  view(h);
  var n=0;POLL=setInterval(function(){if(document.hidden)return;if(++n>30){stopPoll();return;}payCheck(null,false);},6000);
};
async function payCheck(el,manual){
  if(el)busy(el,true);
  try{var r=await post('/api/miniapp/paycheck',{});
    if(r.paid){stopPoll();guardOff();toast(T('paid_ok'),'ok');await refresh();goHome();return;}
    if(manual)toast(T('wait_none'));
  }catch(e){if(manual)toast(e.message||T('error'),'err');}
  finally{if(el)busy(el,false);}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&CUR&&CUR.name==='wait')setTimeout(function(){payCheck(null,false);},700);});

    if(r.ok){toast(T('p2p_cancelled'),'ok');STACK=[];setBack(false);goHome();return;}

async function p2pUpload(req,el,topup){
  var f=document.getElementById('p2pf');f=f&&f.files&&f.files[0];
  if(!f){toast(T('p2p_pick'),'err');return;}
  busy(el,true);
  try{
    var fd=new FormData();fd.append('req_id',String(req));fd.append('photo',f);
    var send=function(){return fetch('/api/cabinet/p2p/screenshot',{method:'POST',headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{},body:fd});};
    var r=await send();
    // Пропуск мини-аппа живёт полчаса, а перевод в банке бывает дольше.
    if(r.status===401&&!WEB&&tg&&tg.initData){await authenticate();r=await send();}
    if(r.status===401&&WEB){logout();return;}
    if(r.ok){view('<div class="card center" style="margin-top:18px">'+IC.check.replace('<svg','<svg style="width:40px;height:40px;color:var(--ok)"')+'<div class="h2" style="margin-top:10px">'+esc(T('p2p_sent'))+'</div><div class="hint">'+esc(T(topup?'p2p_sent_topup':'p2p_sent_text'))+'</div><button class="btn" style="margin-top:16px" onclick="goHome()">'+esc(T('home'))+'</button></div>');STACK=[];setBack(false);haptic('ok');return;}
    var j={};try{j=await r.json();}catch(e){}toast(j.error||T('upload_fail'),'err');
  }catch(e){toast(e.message||T('error'),'err');}
  busy(el,false);
}

function tuPick(k){haptic();CUR.arg.k=k;CUR.arg.custom=false;rerender();}
var tuT=null;
function tuCustom(v){
  var a=CUR.arg;clearTimeout(tuT);
  tuT=setTimeout(function(){
    var k=Math.round(num(v)*100);a.custom=true;a.k=isFinite(k)&&k>0?k:0;
    if(a.o&&a.o.max_kopecks>0&&a.k>a.o.max_kopecks){toast(T('topup_big',rub(a.o.max_kopecks)),'err');a.k=0;}
    var cs=app.querySelectorAll('.chips .chip.on');for(var i=0;i<cs.length;i++)cs[i].classList.remove('on');
    var m=document.getElementById('tuM');if(m)m.innerHTML=tuMethods(a);
  },350);
}

function needLegal(){
  if(STATE.menu&&STATE.menu.legal_accept&&legalDocs().length){go('legalgate',{act:true});return true;}
  return false;
}
async function tuPay(m,el){
  var a=CUR.arg;if(!(a.k>0)){toast(T('topup_bad'),'err');return;}
  if(needLegal())return;
  busy(el,true);
  var tab=m==='p2p'?null:payTab();
  try{var r=await post('/api/miniapp/topup',{kopecks:a.k,method:m});
    if(r.ok&&r.p2p_card){if(r.message)toast(r.message);go('p2p',{card:r.p2p_card,amount:r.p2p_amount,req:r.p2p_req_id,topup:!!r.p2p_topup});return;}
    if(r.redirect){toast(r.message||T('pay_fail'));return;}
    if(r.ok&&r.pay_url&&payTabGo(tab,r.pay_url)){tab=null;guardOn();go('wait',{url:r.pay_url});return;}
    if(r.ok&&r.pay_url){guardOn();if(openSmart(r.pay_url))return;go('wait',{url:r.pay_url});return;}
    toast(r.error||T('pay_fail'),'err');
  }catch(e){toast(e.message||T('error'),'err');}
  finally{payTabDrop(tab);busy(el,false);}
}

/* ---------- подключение ---------- */
function detectOS(){
  try{var p=(tg&&tg.platform)||'';if(p==='ios')return 'ios';if(p==='android'||p==='android_x')return 'android';if(p==='windows'||p==='tdesktop'&&/win/i.test(navigator.userAgent))return 'windows';if(p==='macos')return 'macos';}catch(e){}
  var ua=(navigator.userAgent||'').toLowerCase();
  if(/iphone|ipad|ipod/.test(ua))return 'ios';if(/android/.test(ua))return 'android';if(/windows|win64|win32/.test(ua))return 'windows';if(/mac os|macintosh/.test(ua))return 'macos';if(/linux|x11|cros/.test(ua))return 'linux';
  return WEB?'windows':'android';
}
function cnPlatforms(c){
  if(c&&c.platforms&&c.platforms.length)return c.platforms;
  var o=[];if(c&&c.android&&c.android.length)o.push({key:'android',label:'Android',apps:c.android});if(c&&c.ios&&c.ios.length)o.push({key:'ios',label:'iOS',apps:c.ios});return o;
}
SCREENS.connect=async function(a){
  a=a||{};CUR.arg=a;
  if(!a.c){view(backBtn()+'<div class="sk" style="height:240px"></div><div class="sk" style="height:160px"></div>');
    try{a.c=await api('/api/miniapp/connect');}catch(e){toast(e.message||T('error'),'err');a.c={};}
    var ps=cnPlatforms(a.c),want=detectOS();a.key=ps.some(function(p){return p.key===want;})?want:((ps[0]&&ps[0].key)||'');
    if(!CUR||CUR.arg!==a)return;}
  var c=a.c,ps=cnPlatforms(c),cur=null;ps.forEach(function(p){if(p.key===a.key)cur=p;});if(!cur)cur=ps[0]||null;
  var sub=c.sub_url||(STATE.sub&&STATE.sub.sub_url)||'';
  var h=backBtn()+'<div class="h1" style="margin-top:8px">'+esc(T('conn_title'))+'</div><div class="hint">'+esc(T('conn_text'))+'</div>';
  if(ps.length>1){h+='<div class="seg">';ps.forEach(function(p){h+='<button class="'+(cur&&p.key===cur.key?'on':'')+'" onclick="cnPlat(\''+jsq(p.key)+'\')">'+esc(p.label)+'</button>';});h+='</div>';}
  var apps=(cur&&cur.apps)||[];
  if(!apps.length)h+='<div class="card empty">'+esc(T('conn_empty'))+'</div>';
  h+='<div class="plans-grid">';
  apps.forEach(function(x){
    h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="h2" style="font-size:17px">'+esc(x.name)+'</span>'+(x.featured?'<span class="badge acc">'+esc(T('recommended'))+'</span>':'')+'</div>';
    if(x.add_desc)h+='<div class="hint">'+esc(x.add_desc)+'</div>';
    h+='<div class="stack" style="margin-top:12px">';
    if(x.deeplink)h+='<button class="btn" onclick="openDeep(\''+jsq(x.deeplink)+'\')">'+IC.plus+esc(T('add_sub'))+'</button>';
    (x.installs||[]).forEach(function(b){h+='<button class="btn sec" onclick="openL(\''+jsq(b.url)+'\')">'+IC.download+esc(b.text||T('install'))+'</button>';});
    h+='</div></div>';
  });
  h+='</div>';
  if(sub){h+='<div class="card"><div class="link" style="margin-top:0" onclick="copy(\''+jsq(sub)+'\')"><code>'+esc(sub)+'</code>'+IC.copy+'</div><div class="qr" id="qrw"><div id="qr"></div></div><div class="hint center">'+esc(T('conn_qr'))+'</div></div>';}
  view(h);
  if(sub)drawQR(sub);
};
function cnPlat(k){haptic();CUR.arg.key=k;rerender();}
function drawQR(text){
  var el=document.getElementById('qr');if(!el)return;
  try{if(typeof qrcode==='undefined')throw 0;var q=qrcode(0,'M');q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:1,scalable:true});
    var s=el.querySelector('svg');if(s){s.removeAttribute('width');s.removeAttribute('height');s.style.width='168px';s.style.height='168px';s.style.display='block';}
  }catch(e){var w=document.getElementById('qrw');if(w)w.style.display='none';}
}

  var x=legalDocs()[i];if(!x){goBack();return;}
  var h=backBtn()+'<div class="h1" style="margin-top:8px">'+esc(x.title)+'</div><div class="card legal">'+(x.html||'')+'</div>';
  if(x.url)h+='<button class="btn sec" style="margin-top:12px" onclick="openSmart(\''+jsq(x.url)+'\')">'+IC.link+esc(T('open_full'))+'</button>';
  view(h);
};
function legalGate(){STACK=[];CUR={name:'legalgate',arg:null};SCREENS.legalgate(null);}
SCREENS.legalgate=function(t){
  var h=backBtn()+'<div class="h1" style="margin-top:'+(STACK.length?'8':'18')+'px">'+esc(t&&t.code?T('docs_pay'):T('docs_gate'))+'</div><div class="hint">'+esc(T('docs_gate_text'))+'</div>'+legalItems()+
    '<button class="btn" style="margin-top:16px" onclick="legalAccept(this)">'+IC.check+esc(T('accept'))+'</button>';
  if(WEB&&!t)h+='<button class="btn ghost" style="margin-top:8px" onclick="logout()">'+esc(T('logout'))+'</button>';
  view(h);
};
async function legalAccept(el){
  busy(el,true);
  try{var r=await post('/api/miniapp/legal/accept',{});
    if(r.ok){STATE.menu.legal_accept=false;
      if(STATE.pendingPromo){var pc=STATE.pendingPromo;STATE.pendingPromo='';promoApply(null,pc);}
      var t=CUR&&CUR.arg;if(t&&t.code){go('checkout',t,{replace:true});}else if(t&&t.act){toast(T('done'),'ok');goBack();}else{goHome();}return;}
    toast(r.error||T('error'),'err');
  }catch(e){toast(e.message||T('error'),'err');}
  finally{busy(el,false);}
}

/* ---------- автопродление, триал ---------- */
async function setAP(on,el){
  if(needLegal())return;busy(el,true);
  try{var r=await post('/api/miniapp/autopay',{on:!!on});
    if(r.ok){toast(on?T('ap_enabled'):T('ap_disabled'),'ok');try{STATE.ap=await api('/api/miniapp/autopay');}catch(e){}rerender();return;}
    toast(r.error||T('ap_fail'),'err');
  }catch(e){toast(e.message||T('error'),'err');}
  busy(el,false);
}
async function doTrial(el){
  if(needLegal())return;busy(el,true);
  try{var r=await post('/api/miniapp/trial');
    if(r.ok){toast(T('trial_ok'),'ok');await refresh();goHome();return;}
    toast(r.error||T('trial_fail'),'err');
  }catch(e){toast(e.message||T('error'),'err');}
  busy(el,false);
}

/* ---------- оформление ---------- */
SCREENS.theme=function(){
  var p=themePref(),h=backBtn()+'<div class="h1" style="margin-top:8px">'+esc(T('theme'))+'</div><div class="seg">';
  ['auto','light','dark'].forEach(function(k){h+='<button class="'+(p===k?'on':'')+'" onclick="setTheme(\''+k+'\');rerender()">'+esc(T('th_'+k))+'</button>';});
  view(h+'</div><div class="hint">'+esc(T('th_hint'))+'</div>');
};

/* ---------- аккаунт кабинета ---------- */
async function resend(el){busy(el,true);try{await post('/api/cabinet/email/verify/send',{});toast(T('mail_sent'),'ok');}catch(e){toast(e.message||T('error'),'err');}busy(el,false);}
SCREENS.account=async function(){
  var a=STATE.acct||{};try{a=await api('/api/cabinet/account');STATE.acct=a;}catch(e){}
  if(!CUR||CUR.name!=='account')return;
  var h=backBtn()+'<div style="display:flex;align-items:center;gap:12px;margin-top:8px"><div class="ava">'+esc(String(STATE.me_email||STATE.me_name||'?').trim().charAt(0).toUpperCase())+'</div><div class="h2">'+esc(STATE.me_email||STATE.me_name||T('acct'))+'</div></div><div class="list">';
  if(a.email){h+='<div class="kv"><span class="k">'+esc(T('email'))+'</span><span class="v">'+esc(a.email)+'</span></div><div class="kv"><span class="k">'+esc(T('addr'))+'</span><span class="v" style="color:'+(a.email_verified?'var(--ok)':'var(--bad)')+'">'+esc(a.email_verified?T('verified'):T('not_verified'))+'</span></div>';}
  h+='<div class="kv"><span class="k">Telegram</span><span class="v">'+esc(a.tg_linked?T('tg_linked'):T('tg_not'))+'</span></div></div>';
  if(a.email&&!a.email_verified&&a.mail_on)h+='<button class="btn sec" style="margin-top:12px" onclick="resend(this)">'+esc(T('resend'))+'</button>';
  if(!a.tg_linked)h+='<div class="sect">'+esc(T('bind_tg'))+'</div><div class="card flat" style="margin-top:0"><div class="hint" style="margin-top:0">'+esc(T('bind_text'))+'</div><div class="hint">'+esc(T('bind_only'))+'</div><div class="tgw" id="tgbind"></div></div>';
  if(a.has_password)h+='<div class="sect">'+esc(T('pass_change'))+'</div><div class="card flat stack" style="margin-top:0"><input id="pw0" class="field" type="password" autocomplete="current-password" placeholder="'+esc(T('pass_old'))+'"><input id="pw1" class="field" type="password" autocomplete="new-password" placeholder="'+esc(T('pass_new'))+'"><input id="pw2" class="field" type="password" autocomplete="new-password" placeholder="'+esc(T('pass_new2'))+'"><button class="btn" onclick="changePass(this)">'+esc(T('save'))+'</button><div class="hint">'+esc(T('pass_note'))+'</div></div>';
  h+='<button class="btn danger" style="margin-top:16px" onclick="logout()">'+IC.logout+esc(T('logout'))+'</button>';
  view(h);
  if(!a.tg_linked)mountTG('tgbind','onTGBind(user)');
};
function mountTG(id,cb){
  var put=function(u){if(!u)return;var m=document.getElementById(id);if(!m)return;var s=document.createElement('script');s.async=true;s.src='https://telegram.org/js/telegram-widget.js?22';
    s.setAttribute('data-telegram-login',u);s.setAttribute('data-size','large');s.setAttribute('data-radius','12');s.setAttribute('data-onauth',cb);s.setAttribute('data-request-access','write');m.appendChild(s);};
  if(STATE.botUser){put(STATE.botUser);return;}
  api('/api/cabinet/config').then(function(c){STATE.botUser=c&&c.bot_username;put(STATE.botUser);},function(){});
}
window.onTGBind=function(u){post('/api/cabinet/tg/bind',u).then(function(r){if(r&&r.token){TOKEN=r.token;store('cab_tok',r.token);toast(T('bind_ok'),'ok');STATE.acct=null;boot();return;}toast(T('bind_fail'),'err');}).catch(function(e){toast(e.message||T('bind_fail'),'err');});};
async function changePass(el){
  var v=function(i){var e=document.getElementById(i);return e?e.value:'';};
  var o=v('pw0'),n=v('pw1'),n2=v('pw2');
  if(!o||!n)return toast(T('pass_fill'),'err');if(n!==n2)return toast(T('pass_mismatch'),'err');if(n.length<8)return toast(T('pass_short'),'err');
  busy(el,true);
  try{var r=await post('/api/cabinet/password/change',{old:o,new:n});if(r&&r.token){TOKEN=r.token;store('cab_tok',r.token);}toast(T('pass_ok'),'ok');rerender();return;}
  catch(e){toast(e.message||T('error'),'err');}
  busy(el,false);
}
function logout(){store('cab_tok',null);TOKEN=null;STATE={balanceK:0,methods:[],plans:[],menu:{},sub:{},lang:STATE.lang,botUser:STATE.botUser};paintBalance();renderLogin();}

/* ---------- вход в кабинет ---------- */
function startParams(){
  var p={};try{var q=new URLSearchParams(location.search);['start','promo','plan','ref','inv'].forEach(function(k){var v=q.get(k);if(v)p[k]=v.slice(0,64);});}catch(e){}
  if(p.promo)p.start='promo_'+p.promo;else if(p.plan)p.start='plan_'+p.plan;else if(p.ref)p.start='ref_'+p.ref;else if(p.inv)p.start='inv_'+p.inv;
  return p.start||'';
}
async function renderLogin(){
  STACK=[];CUR={name:'login'};setBack(false);paintBalance();
  var cfg={};try{cfg=await api('/api/cabinet/config');}catch(e){}
  if(BRAND.logo)document.getElementById('brand').innerHTML='';
  STATE.botUser=cfg.bot_username;
  var h='<div class="narrow">'+brandHTML(true)+'<div class="h1 center" style="margin-top:'+(BRAND.logo?'8':'28')+'px">'+esc(T('login'))+'</div><div class="hint center">'+esc(T('login_text'))+'</div>';
  if(cfg.bot_username)h+='<div class="sect">'+esc(T('via_tg'))+'</div><div class="card flat" style="margin-top:0"><div class="tgw" id="tglogin" style="margin-top:0"></div></div>';
  h+='<div class="sect">'+esc(T('via_email'))+'</div><div class="card flat stack" style="margin-top:0"><input id="le" class="field" type="email" autocomplete="email" placeholder="'+esc(T('email'))+'"><input id="lp" class="field" type="password" autocomplete="current-password" placeholder="'+esc(T('password'))+'">'+
    '<button class="btn" onclick="cabAuth(\'login\',this)">'+esc(T('sign_in'))+'</button><button class="btn sec" onclick="cabAuth(\'register\',this)">'+esc(T('register'))+'</button>';
  if(cfg.mail_on)h+='<button class="btn ghost" onclick="go(\'forgot\')">'+esc(T('forgot'))+'</button><div class="hint">'+esc(T('reg_mail'))+'</div>';
  else h+='<div class="hint">'+esc(T('reg_nomail'))+'</div>';
  view(h+'</div></div>');
  if(cfg.bot_username)mountTG('tglogin','onTGAuth(user)');
}
window.onTGAuth=function(u){
  var body=Object.assign({},u);var st=load('cab_start');if(st)body.start=st;
  view('<div class="sk" style="height:200px"></div>');
  post('/api/cabinet/auth/telegram',body).then(function(r){if(r&&r.token){TOKEN=r.token;store('cab_tok',r.token);boot();}else{toast(T('login_fail'),'err');renderLogin();}}).catch(function(e){toast(e.message||T('login_fail'),'err');renderLogin();});
};
async function cabAuth(kind,el){
  var e=document.getElementById('le'),p=document.getElementById('lp');var em=e?e.value.trim():'',pw=p?p.value:'';
  if(!em||!pw){toast(T('fill_login'),'err');return;}
  busy(el,true);
  try{var r=await post('/api/cabinet/auth/'+kind,{email:em,password:pw});if(r&&r.token){TOKEN=r.token;store('cab_tok',r.token);boot();return;}toast(T('login_fail'),'err');}
  catch(x){toast(x.message||T('login_fail'),'err');}
  busy(el,false);
}
SCREENS.login=function(){renderLogin();};
SCREENS.forgot=function(){
  view('<div class="narrow">'+backBtn()+'<div class="h1" style="margin-top:8px">'+esc(T('restore'))+'</div><div class="hint">'+esc(T('restore_text'))+'</div><div class="card flat stack"><input id="fe" class="field" type="email" autocomplete="email" placeholder="'+esc(T('email'))+'"><button class="btn" onclick="doForgot(this)">'+esc(T('send'))+'</button></div></div>');
};
async function doForgot(el){var e=document.getElementById('fe');var v=e?e.value.trim():'';if(!v)return;busy(el,true);try{await post('/api/cabinet/password/forgot',{email:v});}catch(x){}busy(el,false);toast(T('restore_sent'),'ok');}
function openReset(tok){
  STACK=[];CUR={name:'reset',arg:tok};setBack(false);
  view('<div class="narrow">'+brandHTML(true)+'<div class="h1" style="margin-top:18px">'+esc(T('new_pass'))+'</div><div class="hint">'+esc(T('new_pass_text'))+'</div><div class="card flat stack"><input id="r1" class="field" type="password" autocomplete="new-password" placeholder="'+esc(T('pass_new'))+'"><input id="r2" class="field" type="password" autocomplete="new-password" placeholder="'+esc(T('pass_new2'))+'"><button class="btn" onclick="doReset2(this,\''+jsq(tok)+'\')">'+esc(T('save'))+'</button><button class="btn ghost" onclick="renderLogin()">'+esc(T('to_login'))+'</button></div></div>');
}
SCREENS.reset=function(t){openReset(t);};
async function doReset2(el,tok){
  var a=document.getElementById('r1'),b=document.getElementById('r2');var v=a?a.value:'',v2=b?b.value:'';
  if(v!==v2)return toast(T('pass_mismatch'),'err');if(v.length<8)return toast(T('pass_short'),'err');
  busy(el,true);
  try{var r=await post('/api/cabinet/password/reset',{token:tok,password:v});if(r&&r.token){TOKEN=r.token;store('cab_tok',r.token);toast(T('pass_ok'),'ok');boot();return;}toast(T('error'),'err');}
  catch(e){toast(e.message||T('link_bad'),'err');}
  busy(el,false);
}
function dropQuery(){try{history.replaceState({},'',location.pathname);}catch(e){}}

/* ---------- загрузка ---------- */
async function refresh(){
  var r=await Promise.all([api('/api/miniapp/me'),api('/api/miniapp/menu'),api('/api/miniapp/subscription'),api('/api/miniapp/plans')]);
  var me=r[0],menu=r[1],sub=r[2],plans=r[3];
  var extra=(STATE.plans||[]).filter(function(p){return p.link&&!(plans.plans||[]).some(function(q){return q.code===p.code;});});
  STATE.me=me;STATE.menu=menu||{};STATE.sub=sub||{};STATE.plans=((plans&&plans.plans)||[]).concat(extra);STATE.plansNotice=(plans&&plans.notice)||'';
  STATE.balanceK=me.balance_kopecks||0;STATE.methods=menu.pay_methods||[];STATE.me_name=me.name||'';STATE.me_email=me.email||'';
  if(me.lang&&L[me.lang])STATE.lang=me.lang;
  try{STATE.ap=await api('/api/miniapp/autopay');}catch(e){STATE.ap=null;}
  if(WEB){try{STATE.acct=await api('/api/cabinet/account');}catch(e){STATE.acct=null;}}
  paintBalance();paintBrand();
}
async function handleStart(p){
  if(!p)return false;
  if(p.indexOf('promo_')===0){
    // Сначала документы, если их нужно принять: промокод применится после.
    if(STATE.menu.legal_accept&&legalDocs().length){STATE.pendingPromo=p.slice(6);return false;}
    await promoApply(null,p.slice(6));return false;
  }
  if(p.indexOf('plan_')===0){
    try{var r=await api('/api/miniapp/plans?link='+encodeURIComponent(p.slice(5)));
      if(r.plans&&r.plans.length){var lp=r.plans[0];lp.link=true;STATE.plans=STATE.plans.filter(function(x){return x.code!==lp.code;}).concat([lp]);STACK=[{name:'home'}];CUR={name:'plan',arg:{code:lp.code}};SCREENS.plan(CUR.arg);return true;}
      toast(r.notice||T('plan_link_fail'),'err');
    }catch(e){toast(e.message||T('error'),'err');}
  }
  return false;
}
async function boot(){
  guardOff();stopPoll();
  applyTheme();paintBrand();
  try{
    var start='';
    if(WEB){
      var q=new URLSearchParams(location.search);
      var sp=startParams();if(sp)store('cab_start',sp);
      var vt=q.get('verify');if(vt){dropQuery();try{await post('/api/cabinet/email/verify',{token:vt});toast(T('email_ok'),'ok');}catch(e){toast(e.message||T('link_bad'),'err');}}
      var rt=q.get('reset');if(rt){dropQuery();openReset(rt);return;}
      if(sp)dropQuery();
      if(!TOKEN)TOKEN=load('cab_tok');
      if(!TOKEN){renderLogin();return;}
      start=load('cab_start')||'';store('cab_start',null);
    }else{
      if(!tg||!tg.initData){view('<div class="card empty">'+esc(T('open_tg'))+'</div>');return;}
      if(!TOKEN)await authenticate();
      if(!STATE.startDone){STATE.startDone=true;try{start=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';}catch(e){}}
    }
    if(!STATE.me)view('<div class="sk" style="height:190px"></div><div class="sk" style="height:220px"></div>');
    await refresh();
    if(start&&await handleStart(start))return;
    goHome();
  }catch(e){
    if(WEB&&e.status===401){store('cab_tok',null);TOKEN=null;renderLogin();return;}
    view('<div class="card empty">'+esc(T('loading_fail'))+': '+esc(e.message)+'<button class="btn sec" style="margin-top:14px" onclick="boot()">'+IC.refresh+'</button></div>');
  }
}
try{if(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')&&!load('ui_theme')){tg.CloudStorage.getItem('ui_theme',function(err,v){if(!err&&(v==='light'||v==='dark'||v==='auto')){store('ui_theme',v);applyTheme();}});}}catch(e){}
boot();
</script>
